server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never

spring:
  application:
    name: syncpass-backend
  datasource:
    url: jdbc:h2:file:./data/syncpass;MODE=PostgreSQL;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
  jackson:
    serialization:
      write-dates-as-timestamps: false
  h2:
    console:
      enabled: true
      path: /h2-console

app:
  jwt:
    # JWT_SECRET es obligatorio. En desarrollo puede exportarse como variable de entorno.
    # Ejemplo: export JWT_SECRET=$(openssl rand -base64 64)
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS:604800000}
  cors:
    # En desarrollo se permite cualquier origen. En produccion restringir al dominio real.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:*}
  seed-demo-data: ${SEED_DEMO_DATA:true}
  cognito:
    issuer: ${COGNITO_ISSUER:https://cognito-idp.us-east-1.amazonaws.com/us-east-1_eyoBw6XGI}
    client-ids: ${COGNITO_CLIENT_IDS:33tgu296dc5itbh3te23rndi2q,36tb2beisuo9gd5o3bekt3e7ac}
    region: ${COGNITO_REGION:us-east-1}
    jwks-uri: ${COGNITO_JWKS_URI:https://cognito-idp.us-east-1.amazonaws.com/us-east-1_eyoBw6XGI/.wellknown/jwks.json}

logging:
  level:
    org.hibernate.SQL: warn
    com.rojas.syncpass: info
