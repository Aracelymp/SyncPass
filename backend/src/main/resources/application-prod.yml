server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never

spring:
  datasource:
    url: ${DATABASE_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      # validate: solo comprueba que el schema de PostgreSQL coincida con las entidades.
      # Para la creacion inicial del schema usar un script SQL o Flyway, NO update.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.PostgreSQLDialect
  jackson:
    serialization:
      write-dates-as-timestamps: false

app:
  jwt:
    # JWT_SECRET es obligatorio en produccion.
    # Debe tener al menos 32 bytes (256 bits); se recomiendan 64 caracteres aleatorios.
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS:604800000}
  cors:
    # Origenes permitidos separados por comas. No usar * en produccion.
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  seed-demo-data: false
  cognito:
    issuer: ${COGNITO_ISSUER}
    client-ids: ${COGNITO_CLIENT_IDS}
    region: ${COGNITO_REGION}
    jwks-uri: ${COGNITO_JWKS_URI}

logging:
  level:
    org.hibernate.SQL: warn
    com.rojas.syncpass: info
